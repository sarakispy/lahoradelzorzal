services:
  - type: web
    name: la-hora-del-zorzal
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zorzal-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_DEFAULT_USER
        value: admin
      - key: ADMIN_DEFAULT_PASSWORD
        generateValue: true

databases:
  - name: zorzal-postgres
    plan: free
    region: oregon
    databaseName: lahoradelzorzal
    user: zorzal_admin
